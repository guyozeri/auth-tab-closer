<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Signing you in…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101010;
        color: #eee;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;

      }, 1500);
    </script>
