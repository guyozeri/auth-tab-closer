<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Teleport</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 40px;
        padding-top: 40px;
        background: #10152e;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        background: #1c2450;
        border-radius: 10px;
        padding: 40px 80px;
        text-align: center;
        max-width: 480px;
      }
      h1 {
        font-weight: 600;
      }
      .check {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 3px solid #25c2a0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #25c2a0;
        font-size: 28px;
      }
      p {
        color: #aeb4d4;
      }
    </style>
  </head>
  <body>
    <strong style="font-size: 28px">⚙ Teleport</strong>
    <div class="card">
      <div class="check">✓</div>
      <h1>Login Successful</h1>
      <p>You have successfully signed into your account.</p>
      <p>You can close this window and continue using the product.</p>
    </div>
  </body>
</html>
